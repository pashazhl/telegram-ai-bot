<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Bot Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { --fg:#1a1a1a; --muted:#666; --bg:#fafafa; --card:#fff; --border:#e5e5e5; --accent:#0a66c2; --danger:#c0392b }
* { box-sizing:border-box }
body { margin:0; font:14px/1.5 system-ui,-apple-system,sans-serif; color:var(--fg); background:var(--bg) }
header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:24px }
header h1 { margin:0; font-size:18px }
header .stats { color:var(--muted); font-size:13px }
main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto }
.panel { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden }
.panel h2 { margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid var(--border); background:#f8f8f8 }
.user { padding:10px 16px; border-bottom:1px solid var(--border); cursor:pointer }
.user:hover { background:#f0f5fb }
.user.active { background:#e6f0fa }
.user .name { font-weight:600 }
.user .meta { font-size:12px; color:var(--muted) }
.tabs { display:flex; border-bottom:1px solid var(--border); background:#f8f8f8 }
.tabs button { flex:1; padding:10px; border:0; background:none; cursor:pointer; font:inherit; color:var(--muted) }
.tabs button.active { background:var(--card); color:var(--fg); font-weight:600 }
.tab-content { padding:16px; max-height:calc(100vh - 200px); overflow-y:auto }
.empty { color:var(--muted); padding:24px; text-align:center }
.item { padding:10px; border:1px solid var(--border); border-radius:6px; margin-bottom:8px; display:flex; justify-content:space-between; gap:8px }
.item .body { flex:1; min-width:0 }
.item time { color:var(--muted); font-size:12px }
.item button { background:none; border:1px solid var(--danger); color:var(--danger); border-radius:4px; padding:4px 8px; cursor:pointer; font:inherit }
.msg-user { border-left:3px solid var(--accent); padding-left:10px; margin-bottom:10px }
.msg-assistant { border-left:3px solid #888; padding-left:10px; margin-bottom:10px; color:var(--muted) }
.msg pre { white-space:pre-wrap; margin:4px 0; font-family:inherit; font-size:13px }
.role-tag { font-size:11px; text-transform:uppercase; color:var(--muted) }
</style>
</head>
<body>

<header>
  <h1>Telegram AI Bot — admin</h1>
  <span class="stats" id="stats">…</span>
</header>

<main>
  <section class="panel">
    <h2>Пользователи</h2>
    <div id="users"></div>
  </section>

  <section class="panel">
    <div class="tabs">
      <button data-tab="history" class="active">История</button>
      <button data-tab="notes">Заметки</button>
      <button data-tab="reminders">Напоминания</button>
    </div>
    <div class="tab-content" id="content">
      <div class="empty">Выбери пользователя слева</div>
    </div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search)
const TOKEN = params.get('token') || ''
if (!TOKEN) { location.href = '/login'; }

const headers = { 'Authorization': 'Bearer ' + TOKEN }
let activeUser = null
let activeTab = 'history'

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } })
  if (res.status === 401) { location.href = '/login'; return }
  return res.json()
}

function fmtDate(ms) {
  if (!ms) return ''
  const d = new Date(ms)
  return d.toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' })
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

async function loadStats() {
  const s = await api('/api/stats')
  if (!s) return
  document.getElementById('stats').textContent =
    `${s.totalUsers} юзер(ов), ${s.totalMessages} сообщений`
}

async function loadUsers() {
  const users = await api('/api/users')
  if (!users) return
  const root = document.getElementById('users')
  if (!users.length) {
    root.innerHTML = '<div class="empty">Пока никого нет</div>'
    return
  }
  root.innerHTML = users.map(u => `
    <div class="user" data-id="${u.id}">
      <div class="name">${escapeHtml(u.first_name || u.username || u.id)}</div>
      <div class="meta">id ${u.id} · ${u.messages} msg · ${u.notes} notes · ${u.reminders} reminders · ${fmtDate(u.last_seen)}</div>
    </div>
  `).join('')
  root.querySelectorAll('.user').forEach(el => {
    el.addEventListener('click', () => selectUser(el.dataset.id, el))
  })
}

function selectUser(id, el) {
  activeUser = id
  document.querySelectorAll('.user.active').forEach(e => e.classList.remove('active'))
  if (el) el.classList.add('active')
  loadTab()
}

document.querySelectorAll('.tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'))
    b.classList.add('active')
    activeTab = b.dataset.tab
    loadTab()
  })
})

async function loadTab() {
  const root = document.getElementById('content')
  if (!activeUser) { root.innerHTML = '<div class="empty">Выбери пользователя слева</div>'; return }

  if (activeTab === 'history') {
    const items = await api(`/api/users/${activeUser}/history`)
    if (!items?.length) { root.innerHTML = '<div class="empty">История пуста</div>'; return }
    root.innerHTML = items.map(m => `
      <div class="msg msg-${m.role}">
        <div class="role-tag">${m.role}</div>
        <pre>${escapeHtml(m.content)}</pre>
      </div>
    `).join('')
  } else if (activeTab === 'notes') {
    const items = await api(`/api/users/${activeUser}/notes`)
    if (!items?.length) { root.innerHTML = '<div class="empty">Заметок нет</div>'; return }
    root.innerHTML = items.map(n => `
      <div class="item">
        <div class="body"><div>${escapeHtml(n.text)}</div><time>${fmtDate(n.created_at)}</time></div>
        <button onclick="delNote(${n.id})">Удалить</button>
      </div>
    `).join('')
  } else if (activeTab === 'reminders') {
    const items = await api(`/api/users/${activeUser}/reminders`)
    if (!items?.length) { root.innerHTML = '<div class="empty">Напоминаний нет</div>'; return }
    root.innerHTML = items.map(r => `
      <div class="item">
        <div class="body">
          <div>${escapeHtml(r.text)}</div>
          <time>${r.delivered_at ? '✓ доставлено ' + fmtDate(r.delivered_at) : '⏰ сработает в ' + fmtDate(r.trigger_at)}</time>
        </div>
        <button onclick="delReminder(${r.id})">Удалить</button>
      </div>
    `).join('')
  }
}

window.delNote = async (id) => {
  if (!confirm('Удалить заметку?')) return
  await api(`/api/users/${activeUser}/notes/${id}`, { method: 'DELETE' })
  loadTab(); loadUsers()
}
window.delReminder = async (id) => {
  if (!confirm('Удалить напоминание?')) return
  await api(`/api/users/${activeUser}/reminders/${id}`, { method: 'DELETE' })
  loadTab(); loadUsers()
}

loadStats()
loadUsers()
setInterval(() => { loadStats(); loadUsers() }, 30_000)
</script>
</body>
</html>
